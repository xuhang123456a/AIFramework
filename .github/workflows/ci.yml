name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  pure-dotnet:
    name: 纯逻辑闸门（build / test / 生成物 / 适配层形状）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore AIFramework.Pure.sln

      - name: 构建（0 警告 0 错误是硬性要求）
        run: dotnet build AIFramework.Pure.sln --no-restore -v m

      - name: 单元测试 + 架构守卫
        run: dotnet test AIFramework.Pure.sln --no-build -v m

      - name: 生成物一致性（.g.cs 禁止手改，全仓扫描）
        run: dotnet run --project tools/viewgen/ViewGen.csproj --no-build -- --all

      - name: 配置表 JSON 与已导出 .bin 一致（改 JSON 忘导出即失败）
        run: dotnet run --project tools/tablegen/TableGen.csproj --no-build -- --check

      - name: 运营排期体检（活动/礼包跨表冲突）
        run: dotnet run --project tools/opcheck/OpCheck.csproj --no-build -- --tables tables

      - name: 本地化完整性（缺 key 报错、未引用只提示）
        run: dotnet run --project tools/loccheck/LocCheck.csproj --no-build -- --tables tables

      - name: Unity 适配层形状级编译校验（无需 Unity）
        run: pwsh -NoProfile -File unity/tools/check-adapter-compile.ps1

      - name: 数值体检（价格/主键/经验单调/权重等不变量）
        run: dotnet run --project tools/tablecheck/TableCheck.csproj --no-build -- --tables tables

      - name: 配置表导出结果与两个目标目录逐字节一致（与 legacy fixtures 交叉校验）
        run: |
          dotnet run --project tools/tablegen/TableGen.csproj --no-build -- --verify-against unity/Assets/StreamingAssets/AIFrameworkDemo
          dotnet run --project tools/tablegen/TableGen.csproj --no-build -- --verify-against src/Adapters/AIFramework.Adapters.Console/DemoTables
